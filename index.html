<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formkurve">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Formkurve</title>
<style>
/* Layout: iOS-App – Large Titles, Inset-Grouped-Listen, Tab-Bar unten. Schrift: San Francisco (System), Zahlen in SF Rounded. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7;
  --label:#000000; --label2:rgba(60,60,67,.60); --label3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --bar:rgba(249,249,249,.86);
  --roman:#007AFF; --alina:#FF2D55;
  --green:#34C759; --orange:#FF9500; --red:#FF3B30; --yellow:#FFCC00; --teal:#30B0C7; --indigo:#5856D6;
  --ring-kcal:#FA114F; --ring-prot:#5ACD3C; --ring-steps:#1AC2DA;
  --shadow:0 1px 0 rgba(0,0,0,.02);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --tint:var(--roman);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.60); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --bar:rgba(22,22,24,.82);
  --roman:#0A84FF; --alina:#FF375F;
  --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --yellow:#FFD60A; --teal:#40C8E0; --indigo:#5E5CE6;
  --ring-kcal:#FA114F; --ring-prot:#A6FF00; --ring-steps:#00F0FF;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.60); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --bar:rgba(22,22,24,.82);
  --roman:#0A84FF; --alina:#FF375F;
  --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --yellow:#FFD60A; --teal:#40C8E0; --indigo:#5E5CE6;
  --ring-kcal:#FA114F; --ring-prot:#A6FF00; --ring-steps:#00F0FF;
  color-scheme:dark; }

html,body{background:var(--bg);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:1.29;letter-spacing:-.41px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body[data-tint="w"]{--tint:var(--alina)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-round);font-variant-numeric:tabular-nums}

/* ---------- Screens ---------- */
.app{max-width:560px;margin:0 auto;padding-block:calc(6px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.nav .sub{font-size:13px;color:var(--label2);letter-spacing:-.08px;font-weight:600;text-transform:uppercase}
.nav-btns{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--tint);background:var(--fill)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.large-title{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:41px;letter-spacing:.37px;margin:2px 0 14px;text-wrap:balance}
.headline-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:13px;font-weight:600;letter-spacing:-.08px;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.tint{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.pill .dot{width:8px;height:8px;border-radius:4px;background:currentColor}

.section{margin-top:28px}
.section:first-of-type{margin-top:0}
.section-h{font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px;display:flex;justify-content:space-between;gap:8px}
.section-f{font-size:13px;line-height:18px;color:var(--label2);padding:7px 16px 0;letter-spacing:-.08px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 16px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--fill)}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;font-size:13px;color:var(--label2);letter-spacing:-.08px;margin-top:1px}
.row .val{color:var(--label2);text-align:right}
.row .unit{color:var(--label2);min-width:30px;text-align:left;font-size:15px}
.row .chev{color:var(--label3);width:9px;height:14px;flex:none}
.field{border:0;background:transparent;text-align:right;width:110px;min-width:0;padding:6px 0;outline:none;color:var(--label);font-family:var(--font-round);font-variant-numeric:tabular-nums}
.field::placeholder{color:var(--label3)}
.field.wide{width:100%;text-align:left;font-family:var(--font)}
textarea.field{resize:none;min-height:66px;line-height:1.35}

/* Switch */
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}

/* Stepper */
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px;flex:none}
.stepper button{width:46px;height:32px;display:grid;place-items:center;color:var(--label)}
.stepper button+button{border-left:.5px solid var(--sep)}
.stepper svg{width:14px;height:14px}

/* Slider */
.slider-row{flex-direction:column;align-items:stretch;gap:2px;padding-block:10px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline}
.slider-top .v{font-family:var(--font-round);font-weight:600;color:var(--label2);font-variant-numeric:tabular-nums}
.slider-top .v.set{color:var(--tint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--tint) var(--p,0%),var(--fill2) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--tint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 0.5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 0.5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}
input[type=range].unset::-webkit-slider-thumb{background:var(--card2);box-shadow:inset 0 0 0 1px var(--sep)}
.slider-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--label3)}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{min-height:30px;padding:0 4px;border-radius:7px;font-size:13px;font-weight:500;letter-spacing:-.08px;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366} }
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}

/* Rings card */
.summary{padding:16px}
.sum-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.kst{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;vertical-align:1px}
.kst.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.kst.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.kst.over{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.kbar{margin-top:14px}
.kbar-track{position:relative;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.kbar .z{position:absolute;top:0;bottom:0;opacity:.28}
.z-ok{background:var(--green)} .z-warn{background:var(--orange)} .z-over{background:var(--red)}
.kbar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ring-kcal);transition:width .3s}
.kbar-fill.s-ok{background:var(--green)} .kbar-fill.s-warn{background:var(--orange)} .kbar-fill.s-over{background:var(--red)}
.kbar-goal{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--label)}
.kbar-scale{position:relative;height:16px;margin-top:4px;font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
.kbar-scale span{position:absolute;top:0;white-space:nowrap}
.kbar-scale span:nth-child(2){transform:translateX(-50%)}
.quote{padding:16px 16px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--tint) 16%,var(--card)),var(--card));border-radius:12px;margin-bottom:22px}
.quote q{display:block;font-family:var(--font-display);font-size:19px;line-height:1.32;font-weight:600;letter-spacing:-.3px;quotes:"„" "“";text-wrap:pretty}
.quote .qs{margin-top:8px;font-size:13px;color:var(--label2)}
.plan-today{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.plan-today .t{font-family:var(--font-round);font-weight:600;font-size:17px;color:var(--tint);min-width:48px}
.plan-today .lbl{flex:1}
.rings{width:132px;height:132px}
.legend{display:grid;gap:10px;min-width:0}
.legend .k{font-size:13px;font-weight:600;letter-spacing:-.08px}
.legend .v{font-family:var(--font-round);font-size:20px;font-weight:600;line-height:24px;font-variant-numeric:tabular-nums}
.legend .v span{font-size:15px;color:var(--label2);font-weight:500}
.c-kcal{color:var(--ring-kcal)} .c-prot{color:var(--ring-prot)} .c-steps{color:var(--ring-steps)}
@media (max-width:360px){.summary{grid-template-columns:1fr;justify-items:center}.legend{justify-self:stretch}}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font-weight:600;font-size:17px;background:var(--tint);color:#fff}
.btn.secondary{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.btn.plain{background:var(--card);color:var(--tint);font-weight:400}
.btn:active{opacity:.75}
.link{color:var(--tint)}
.danger{color:var(--red)}

/* Tiles */
.empty-chart{padding:28px 8px;text-align:center;color:var(--label2);font-size:15px;line-height:1.4}
.sched{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1.3fr) 32px;gap:8px;align-items:center;padding:8px 16px}
.sched select,.sched input{width:100%;min-height:36px;border-radius:8px;border:0;background:var(--fill);padding:0 8px;font-size:15px}
.sched .del{width:32px;height:32px;border-radius:16px;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);font-size:20px;line-height:1}
.trip{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 12px 10px;min-width:0}
.tile .k{font-size:12px;font-weight:600;color:var(--label2);letter-spacing:0;text-transform:uppercase}
.tile .v{font-family:var(--font-round);font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:13px;color:var(--label2);font-weight:500}
.tile .s{font-size:12px;color:var(--label2);margin-top:2px}

.card{background:var(--card);border-radius:12px;padding:14px 16px}
.card h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.24px}
.card .meta{font-size:13px;color:var(--label2);letter-spacing:-.08px}
.chart svg{display:block;width:100%;height:auto}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--tint)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.kv + .kv{border-top:.5px solid var(--sep)}
.kv b{font-family:var(--font-round);font-weight:600;font-variant-numeric:tabular-nums}
.big{font-family:var(--font-round);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:17px;color:var(--label2);font-weight:500}

/* Status chips */
.amp{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.amp i{width:10px;height:10px;border-radius:5px;background:var(--label3)}
.amp.g i{background:var(--green)} .amp.y i{background:var(--yellow)} .amp.r i{background:var(--red)} .amp.u i{background:var(--teal)}

/* Training */
.ex{background:var(--card);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.ex + .ex{margin-top:10px}
.ex-h{display:flex;align-items:flex-start;gap:12px}
.ex-n{width:26px;height:26px;border-radius:13px;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label2);flex:none;font-family:var(--font-round)}
.ex.fin .ex-n{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.ex-t{flex:1;min-width:0}
.ex-t b{display:block;font-weight:600;font-size:17px;letter-spacing:-.41px}
.ex-t span{display:block;font-size:13px;color:var(--label2);letter-spacing:-.08px;margin-top:2px}
.check{width:28px;height:28px;border-radius:14px;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;color:#fff}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.check[aria-pressed="true"] svg{opacity:1}
.target{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:15px}
.target .up{color:var(--green);font-weight:600}
.target b{font-family:var(--font-round);font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(var(--n,3),minmax(0,1fr));gap:8px}
.sets.bw{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.cell{display:grid;gap:4px}
.cell label{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;text-align:center;letter-spacing:.02em}
.cell input{width:100%;height:44px;border-radius:10px;border:0;background:var(--fill);text-align:center;font-family:var(--font-round);font-size:19px;font-weight:600;outline:none;font-variant-numeric:tabular-nums;color:var(--label)}
.cell input:focus{box-shadow:inset 0 0 0 2px var(--tint)}
.cell input.hit{color:var(--green)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px -6px 2px}
.figs figure{margin:0;background:#FFFFFF;border-radius:10px;position:relative;overflow:hidden}
.figs svg{display:block;width:100%;height:auto}
.figs figcaption{position:absolute;left:8px;top:6px;font-size:11px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:.04em}
.ex-t .mchip{display:inline-block;margin-top:0;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,#D9533A 14%,transparent);color:#C2412B;font-weight:600;margin-right:2px}
.plan-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:12px 4px 0;font-size:13px;font-weight:600;color:var(--label2);letter-spacing:-.08px}
.ex.cardio{margin-top:10px;background:color-mix(in srgb,var(--tint) 7%,var(--card))}
.ex.cardio .ex-n{background:var(--tint);color:#fff}
details.tech summary{list-style:none;font-size:13px;color:var(--tint);cursor:pointer}
details.tech summary::-webkit-details-marker{display:none}
details.tech p{margin:6px 0 0;font-size:13px;color:var(--label2);line-height:1.4;letter-spacing:-.08px}
.pause{font-size:13px;color:var(--tint);font-weight:600}
.ex-foot{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2)}
.mini input{width:52px;height:30px;border-radius:8px;border:0;background:var(--fill);text-align:center;font-family:var(--font-round);font-size:15px;outline:none;color:var(--label)}
.banner{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.35;background:color-mix(in srgb,var(--orange) 14%,var(--card));margin-bottom:16px;letter-spacing:-.24px}
.banner b{display:block;margin-bottom:2px}
.banner.info{background:color-mix(in srgb,var(--tint) 10%,var(--card))}
.note{font-size:13px;color:var(--label2);line-height:1.4;letter-spacing:-.08px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:2px;padding-top:2px;color:var(--label2);font-size:10px;font-weight:500;letter-spacing:.1px}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--tint)}

/* Rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:21;
  background:var(--label);color:var(--bg);border-radius:22px;height:44px;padding:0 8px 0 18px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--font-round);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.timer button{height:32px;padding:0 12px;border-radius:16px;background:color-mix(in srgb,var(--bg) 18%,transparent);font-family:var(--font);font-size:15px;font-weight:600}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 44px - env(safe-area-inset-top,0px));
  background:var(--bg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.sheet-in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px}
.sheet-h .t{font-weight:600}
.sheet-h .l{justify-self:start;color:var(--tint)}
.sheet-h .r{justify-self:end;color:var(--tint);font-weight:600}
.sheet-b{overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));min-height:0}

.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who button{background:var(--card);border-radius:16px;padding:18px 12px;display:grid;justify-items:center;gap:10px;border:2px solid transparent}
.who button[aria-pressed="true"]{border-color:var(--tint)}
.avatar{width:64px;height:64px;border-radius:32px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:26px;font-family:var(--font-round)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);z-index:60;background:var(--card);color:var(--label);
  border-radius:22px;padding:10px 18px;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.toast.on{transform:translate(-50%,0)}
.sync{font-size:12px;color:var(--label3);display:inline-flex;align-items:center;gap:5px}
.sync i{width:6px;height:6px;border-radius:3px;background:var(--label3)}
.sync.ok i{background:var(--green)} .sync.local i{background:var(--orange)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <section class="screen" id="s-heute"></section>
  <section class="screen" id="s-training" hidden></section>
  <section class="screen" id="s-fortschritt" hidden></section>
  <section class="screen" id="s-mehr" hidden></section>
</div>

<nav class="tabbar" aria-label="Bereiche">
  <div class="tabbar-in" role="tablist">
    <button class="tab" role="tab" data-tab="heute" aria-selected="true" id="t-heute">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="14" cy="14" r="10"/><circle cx="14" cy="14" r="5.5"/><circle cx="14" cy="14" r="1.4" fill="currentColor" stroke="none"/></svg>Heute</button>
    <button class="tab" role="tab" data-tab="training" aria-selected="false" id="t-training">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 11v6M24 11v6M7.5 8.5v11M20.5 8.5v11M7.5 14h13"/></svg>Training</button>
    <button class="tab" role="tab" data-tab="fortschritt" aria-selected="false" id="t-fortschritt">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l6-6 4 4 9-10"/><path d="M18 8h5v5"/></svg>Fortschritt</button>
    <button class="tab" role="tab" data-tab="mehr" aria-selected="false" id="t-mehr">
      <svg viewBox="0 0 28 28" fill="currentColor"><circle cx="7" cy="14" r="2.2"/><circle cx="14" cy="14" r="2.2"/><circle cx="21" cy="14" r="2.2"/></svg>Mehr</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Formkurve – Übungsillustrationen. Eigene Zeichnungen: Körper hellgrau, Zielmuskeln rot. */
const FIG = (() => {
  const D2R = Math.PI / 180;
  const V = (a, l) => [Math.cos(a * D2R) * l, Math.sin(a * D2R) * l];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const f = n => n.toFixed(1);
  const L = { neck: 6, torso: 50, head: 10, thigh: 44, shin: 42, foot: 17, ua: 29, fa: 25 };
  const GROUND = 186;

  const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="fk-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D4D4D6"/></linearGradient>
    <linearGradient id="fk-far" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9E9EB"/><stop offset="1" stop-color="#BDBDC2"/></linearGradient>
    <linearGradient id="fk-mus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F08A6E"/><stop offset=".55" stop-color="#D9533A"/><stop offset="1" stop-color="#A93424"/></linearGradient>
    <linearGradient id="fk-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3A3C"/><stop offset="1" stop-color="#0E0E10"/></linearGradient>
    <radialGradient id="fk-shadow"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs></svg>`;

  // ---------- Grundformen ----------
  function capsule(A, B, rA, rB) {
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const a1 = [A[0] + nx * rA, A[1] + ny * rA], b1 = [B[0] + nx * rB, B[1] + ny * rB];
    const b2 = [B[0] - nx * rB, B[1] - ny * rB], a2 = [A[0] - nx * rA, A[1] - ny * rA];
    return `M${f(a1[0])} ${f(a1[1])}L${f(b1[0])} ${f(b1[1])}A${f(rB)} ${f(rB)} 0 0 1 ${f(b2[0])} ${f(b2[1])}L${f(a2[0])} ${f(a2[1])}A${f(rA)} ${f(rA)} 0 0 1 ${f(a1[0])} ${f(a1[1])}Z`;
  }
  const body = (d, far) => `<path d="${d}" fill="url(#fk-${far ? "far" : "skin"})" stroke="#9C9CA2" stroke-width=".9" stroke-linejoin="round"/>`;
  const musPath = d => `<path d="${d}" fill="url(#fk-mus)" stroke="#8E2A1C" stroke-width=".6" stroke-linejoin="round"/>`;
  // Muskelbauch auf einer Seite eines Segments (side +1 = vorne, -1 = hinten)
  function belly(A, B, rA, rB, side, t0, t1, k = 1, normalSign = 1) {
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;
    const nx = (dy / len) * normalSign * side, ny = (-dx / len) * normalSign * side;
    const at = (t, w) => { const r = rA + (rB - rA) * t; return [A[0] + dx * t + nx * r * w, A[1] + dy * t + ny * r * w]; };
    const p0 = at(t0, 0.25), p1 = at(t1, 0.25), c0 = at(t0 + (t1 - t0) * 0.25, 1.15 * k), c1 = at(t0 + (t1 - t0) * 0.75, 1.15 * k);
    const q0 = at(t0 + (t1 - t0) * 0.7, -0.15), q1 = at(t0 + (t1 - t0) * 0.3, -0.15);
    return musPath(`M${f(p0[0])} ${f(p0[1])}C${f(c0[0])} ${f(c0[1])} ${f(c1[0])} ${f(c1[1])} ${f(p1[0])} ${f(p1[1])}C${f(q0[0])} ${f(q0[1])} ${f(q1[0])} ${f(q1[1])} ${f(p0[0])} ${f(p0[1])}Z`);
  }
  const ell = (c, rx, ry, rot, fill, stroke = "#9C9CA2") => `<ellipse cx="${f(c[0])}" cy="${f(c[1])}" rx="${f(rx)}" ry="${f(ry)}" transform="rotate(${f(rot)} ${f(c[0])} ${f(c[1])})" fill="${fill}" stroke="${stroke}" stroke-width=".8"/>`;

  // ---------- Geräte ----------
  const EQ = {
    plate: (p, r = 17) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="url(#fk-plate)"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r * .62)}" fill="none" stroke="#4A4A4E" stroke-width="1"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r * .22)}" fill="#8E8E93"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r * .09)}" fill="#3A3A3C"/>`,
    db: (p) => `<rect x="${f(p[0] - 7)}" y="${f(p[1] - 7)}" width="14" height="14" rx="3" fill="url(#fk-plate)"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="2.6" fill="#8E8E93"/>`,
    bar: (p) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2.6" fill="#6E6E73"/>`,
    handle: (p) => `<rect x="${f(p[0] - 4)}" y="${f(p[1] - 2.2)}" width="8" height="4.4" rx="2" fill="#3A3A3C"/>`,
    cable: (a, b) => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#8E8E93" stroke-width="1.1"/><circle cx="${f(a[0])}" cy="${f(a[1])}" r="4" fill="#48484A"/><circle cx="${f(a[0])}" cy="${f(a[1])}" r="1.4" fill="#C7C7CC"/>`,
    tower: (x, y0 = 6, y1 = GROUND) => `<rect x="${x - 4}" y="${y0}" width="8" height="${y1 - y0}" rx="2" fill="#E5E5EA" stroke="#C7C7CC"/>`,
    pad: (x, y, w, h, rot = 0) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="3.5" fill="#2C2C2E" transform="rotate(${rot} ${f(x)} ${f(y)})"/>`,
    leg: (x, y0, y1 = GROUND) => `<line x1="${f(x)}" y1="${f(y0)}" x2="${f(x)}" y2="${y1}" stroke="#636366" stroke-width="3" stroke-linecap="round"/>`,
    roller: (p, r = 6) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="#2C2C2E"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r * .35)}" fill="#8E8E93"/>`,
    box: (x, y, w, h) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#D1D1D6" stroke="#AEAEB2"/>`,
    bag: (p) => `<rect x="${f(p[0] - 9)}" y="${f(p[1] - 2)}" width="18" height="22" rx="5" fill="#3A3A3C"/><rect x="${f(p[0] - 6)}" y="${f(p[1] + 8)}" width="12" height="7" rx="2" fill="#48484A"/><path d="M${f(p[0] - 4)} ${f(p[1] - 1)}Q${f(p[0])} ${f(p[1] - 7)} ${f(p[0] + 4)} ${f(p[1] - 1)}" fill="none" stroke="#3A3A3C" stroke-width="2"/>`,
    chair: (x, y, w = 34) => `<rect x="${f(x)}" y="${f(y)}" width="${w}" height="6" rx="2" fill="#8E8E93"/><line x1="${f(x + 3)}" y1="${f(y + 6)}" x2="${f(x + 3)}" y2="${GROUND}" stroke="#8E8E93" stroke-width="3"/><line x1="${f(x + w - 3)}" y1="${f(y + 6)}" x2="${f(x + w - 3)}" y2="${GROUND}" stroke="#8E8E93" stroke-width="3"/>`,
    mat: (x1, x2) => `<rect x="${f(x1)}" y="${GROUND - 2}" width="${f(x2 - x1)}" height="4" rx="2" fill="#C7C7CC"/>`,
    beam: (a, b, w = 4, c = "#636366") => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`
  };

  // ---------- Seitenansicht ----------
  function side(pose, muscles) {
    const P = Object.assign({ torso: -90, tilt: 0, legs: [{ th: 90, sh: 90 }, { th: 92, sh: 92 }], arms: [{ ua: 90, fa: 90 }, { ua: 92, fa: 92 }] }, pose);
    const M = new Set(muscles);
    let H = [0, 0];
    const S = add(H, V(P.torso, L.torso));
    const head = add(S, V(P.torso + P.tilt, L.neck + L.head));
    const legs = P.legs.map(l => { const K = add(H, V(l.th, L.thigh)), A = add(K, V(l.sh, L.shin)); const fa = l.ft ?? (l.sh - 90); const T = add(A, V(fa, L.foot)); return { K, A, T }; });
    const arms = P.arms.map(a => { const E = add(S, V(a.ua, L.ua)), W = add(E, V(a.fa, L.fa)); return { E, W }; });
    // Anker
    let off = [0, 0];
    if (P.hip) off = P.hip;
    else if (P.anchor) {
      const [part, idx, at] = P.anchor;
      const src = part === "ankle" ? legs[idx].A : part === "toe" ? legs[idx].T : part === "hand" ? arms[idx].W : part === "knee" ? legs[idx].K : part === "shoulder" ? S : H;
      off = [at[0] - src[0], at[1] - src[1]];
    }
    const T = p => add(p, off);
    const J = { H: T(H), S: T(S), head: T(head), legs: legs.map(l => ({ K: T(l.K), A: T(l.A), T: T(l.T) })), arms: arms.map(a => ({ E: T(a.E), W: T(a.W) })), torso: P.torso };
    const eq = P.eq ? P.eq(J) : {};
    let s = "";
    if (P.shadow !== false) s += `<ellipse cx="${f((J.legs[0].A[0] + J.legs[1].A[0]) / 2)}" cy="${GROUND + 2}" rx="34" ry="4" fill="url(#fk-shadow)"/>`;
    s += eq.back || "";
    const leg = (i, far) => {
      const l = J.legs[i]; let o = "";
      o += body(capsule(l.K, l.A, 7.6, 4.6), far) + body(capsule(l.A, l.T, 4.6, 3.4), far);
      if (M.has("calves")) o += belly(l.K, l.A, 7.6, 4.6, -1, 0.06, 0.55, 1.1);
      o += body(capsule(J.H, l.K, 11, 7.6), far);
      if (M.has("quads")) o += belly(J.H, l.K, 11, 7.6, 1, 0.12, 0.93);
      if (M.has("hams")) o += belly(J.H, l.K, 11, 7.6, -1, 0.14, 0.9);
      return o;
    };
    const arm = (i, far) => {
      const a = J.arms[i]; let o = "";
      o += body(capsule(a.E, a.W, 5, 3.6), far);
      o += `<circle cx="${f(a.W[0])}" cy="${f(a.W[1])}" r="4.2" fill="url(#fk-${far ? "far" : "skin"})" stroke="#9C9CA2" stroke-width=".9"/>`;
      o += body(capsule(J.S, a.E, 7, 5), far);
      if (M.has("biceps")) o += belly(J.S, a.E, 7, 5, 1, 0.22, 0.92);
      if (M.has("triceps")) o += belly(J.S, a.E, 7, 5, -1, 0.18, 0.92);
      return o;
    };
    s += arm(1, true) + leg(1, true);
    // Rumpf
    const dir = V(P.torso, 1), back = [dir[1], -dir[0]]; // hinten
    const post = (t, r) => add(add(J.H, V(P.torso, L.torso * t)), [back[0] * r, back[1] * r]);
    // Gesäß
    const gC = post(0.05, 8.5);
    const ant = [-back[0], -back[1]];
    const chestC = add(add(J.H, V(P.torso, L.torso * 0.74)), [ant[0] * 6, ant[1] * 6]);
    s += body(capsule(J.H, J.S, 12.5, 14.5));
    s += ell(gC, 12, 10.5, P.torso, "url(#fk-skin)");
    s += ell(chestC, 12, 13, P.torso, "url(#fk-skin)");
    s += body(capsule(J.S, J.head, 4.2, 4.2));
    s += `<circle cx="${f(J.head[0])}" cy="${f(J.head[1])}" r="${L.head}" fill="url(#fk-skin)" stroke="#9C9CA2" stroke-width=".9"/>`;
    const ns = -1; // Rumpf: vorne = gegen die Bein-Normale
    if (M.has("glutes")) s += ell(gC, 11, 9.5, P.torso, "url(#fk-mus)", "#8E2A1C");
    if (M.has("abs")) s += belly(J.H, J.S, 12.5, 14.5, 1, 0.14, 0.58, 0.95, ns);
    if (M.has("chest")) s += ell(add(chestC, [ant[0] * 2, ant[1] * 2]), 10, 11, P.torso, "url(#fk-mus)", "#8E2A1C");
    if (M.has("lats")) s += belly(J.H, J.S, 12.5, 14.5, -1, 0.4, 0.95, 1.1, ns);
    if (M.has("lowback")) s += belly(J.H, J.S, 12.5, 14.5, -1, 0.16, 0.42, 0.85, ns);
    if (M.has("traps")) s += belly(J.S, J.head, 9, 5, 1, 0.0, 0.5, 1, 1);
    s += eq.mid || "";
    s += leg(0, false) + arm(0, false);
    // Schulterkappe
    s += `<circle cx="${f(J.S[0])}" cy="${f(J.S[1])}" r="8.2" fill="${M.has("delts") ? "url(#fk-mus)" : "url(#fk-skin)"}" stroke="${M.has("delts") ? "#8E2A1C" : "#9C9CA2"}" stroke-width=".8"/>`;
    if (M.has("reardelt")) s += ell(add(J.S, [back[0] * 3.5, back[1] * 3.5]), 4.5, 6.5, P.torso, "url(#fk-mus)", "#8E2A1C");
    s += eq.front || "";
    return s;
  }

  // ---------- Frontansicht ----------
  function front(pose, muscles) {
    const P = Object.assign({ cx: 100, hipY: 110, arm: 84, fa: 0, leg: 92, seated: false }, pose);
    const M = new Set(muscles);
    const cx = P.cx, hy = P.hipY, sy = hy - 50;
    let s = `<ellipse cx="${cx}" cy="${GROUND + 2}" rx="40" ry="4" fill="url(#fk-shadow)"/>`;
    s += P.eq ? (P.eq({ cx, hy, sy }).back || "") : "";
    const sides = [-1, 1];
    // Beine
    sides.forEach(sd => {
      const H = [cx + sd * 10, hy + 4];
      const lg = sd < 0 ? (P.legL ?? P.leg) : (P.legR ?? P.leg);
      const thLen = P.seated ? 20 : 44, ang = 90 - sd * (lg - 90);
      const K = add(H, V(ang, thLen));
      const A = P.seated ? [K[0], K[1] + 40] : add(K, V(90 - sd * (lg - 90) * (sd < 0 ? (P.legL != null ? 1 : 0.4) : (P.legR != null ? 1 : 0.4)), 42));
      s += body(capsule(K, A, 6.4, 4.2)) + body(capsule(A, [A[0] + sd * 3, A[1] + 6], 4.2, 3.6));
      s += body(capsule(H, K, 10, 7));
      if (M.has("quads")) s += belly(H, K, 10, 7, sd, 0.15, 0.9, 0.8);
      if (M.has("abductor")) s += ell([cx + sd * 19, hy + 2], 6, 10, sd * 12, "url(#fk-mus)", "#8E2A1C");
    });
    // Rumpf
    s += `<path d="M${cx - 21} ${sy + 2}Q${cx - 24} ${sy + 22} ${cx - 15} ${hy - 6}L${cx - 19} ${hy + 10}Q${cx} ${hy + 18} ${cx + 19} ${hy + 10}L${cx + 15} ${hy - 6}Q${cx + 24} ${sy + 22} ${cx + 21} ${sy + 2}Q${cx} ${sy - 6} ${cx - 21} ${sy + 2}Z" fill="url(#fk-skin)" stroke="#9C9CA2" stroke-width=".9"/>`;
    if (M.has("chest")) sides.forEach(sd => s += ell([cx + sd * 9, sy + 11], 9.5, 7, 0, "url(#fk-mus)", "#8E2A1C"));
    if (M.has("abs")) s += `<rect x="${cx - 8}" y="${sy + 21}" width="16" height="${hy - sy - 22}" rx="6" fill="url(#fk-mus)" stroke="#8E2A1C" stroke-width=".6"/>`;
    s += body(capsule([cx, sy], [cx, sy - 14], 4.5, 4.5));
    s += `<circle cx="${cx}" cy="${sy - 22}" r="${L.head}" fill="url(#fk-skin)" stroke="#9C9CA2" stroke-width=".9"/>`;
    // Arme
    sides.forEach(sd => {
      const S = [cx + sd * 22, sy + 4];
      const ang = 90 - sd * (90 - P.arm);
      const E = add(S, V(ang, L.ua)), W = add(E, V(90 - sd * (90 - P.arm) - sd * P.fa, L.fa));
      s += body(capsule(E, W, 4.4, 3.3)) + `<circle cx="${f(W[0])}" cy="${f(W[1])}" r="4.2" fill="url(#fk-skin)" stroke="#9C9CA2" stroke-width=".9"/>`;
      s += body(capsule(S, E, 6.2, 4.5));
      s += `<circle cx="${f(S[0])}" cy="${f(S[1])}" r="7.6" fill="${M.has("delts") ? "url(#fk-mus)" : "url(#fk-skin)"}" stroke="${M.has("delts") ? "#8E2A1C" : "#9C9CA2"}" stroke-width=".8"/>`;
      if (P.hold) s += P.hold(W, sd);
    });
    s += P.eq ? (P.eq({ cx, hy, sy }).front || "") : "";
    return s;
  }

  // ---------- Übungen: je zwei Phasen ----------
  const LIE = (y = 150) => ({ hip: [118, y] });
  // Polster quer zu einem Segment auf der Vorder- (+1) oder Rückseite (-1)
  function padAcross(A, B, t, side, dist, w = 22, h = 8) {
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, nx = uy * side, ny = -ux * side;
    const c = [A[0] + dx * t + nx * dist, A[1] + dy * t + ny * dist];
    const ang = Math.atan2(uy, ux) * 180 / Math.PI;
    return { c, svg: `<rect x="${f(c[0] - w / 2)}" y="${f(c[1] - h / 2)}" width="${w}" height="${h}" rx="3.5" fill="#2C2C2E" transform="rotate(${f(ang)} ${f(c[0])} ${f(c[1])})"/>` };
  }
  function hyperEq(J) {

const weekOf = s => Math.floor(diffDays(P().startDate, s)/7) + 1;
const weekStart = w => addDays(P().startDate, 7*(w-1));
function phase(w){
  if (w <= 0) return "Vorbereitung";
  const p = P(), ws = weekStart(w), we = addDays(ws,6);
  if (we >= p.vacFrom && ws <= p.vacTo) return "Urlaub";
  if (w <= 2) return "Einstieg";
  if (MAINT.has(w)) return "Erhaltung";
  return "Defizit";
}
function tphase(w){
  if (w <= 0) return "Vorbereitung";
  if (phase(w) === "Urlaub") return "Urlaub";
  if (w <= 2) return "Technik";
  if (DELOAD.has(w)) return "Deload";
  if (w <= 8) return "Fundament";
  if (w >= 23 && w <= 33) return "Volumen";
  if (w >= 35 && w <= 39) return "Endspurt";
  return "Aufbau";
}
const inTrip = d => P().trips.some(t => t.from && t.to && d >= t.from && d <= t.to);
const unitName = u => u === "S" ? P().sportLabel : UNITS[P().tmpl][u]?.name || u;
const kcalGoal = w => { const ph = phase(w); const k = P().kcal; return ph==="Vorbereitung"||ph==="Einstieg" ? k.Einstieg : ph==="Defizit" ? k.Defizit : k.Erhaltung; };
const stepGoal = w => { const p = P(); return Math.min(p.stepsEnd, p.steps0 + p.stepInc*(Math.max(w,1)-1)); };
const wpGoal = w => { const p = P(); return Math.min(p.wpEnd, p.wp0 + p.wpInc*(Math.max(w,1)-1)); };
const isDef = w => { const ph = phase(w); return ph==="Einstieg" || ph==="Defizit"; };
const defWeeks = w => { let n=0; for (let i=1;i<=w;i++) if (isDef(i)) n++; return n; };
const scenario = (rate, w) => { const p=P(); return Math.max(p.goal, p.kg*Math.pow(1-rate, defWeeks(w))); };
function milestones(){ const p=P(); const m=[0.05,0.10,0.15,0.20,0.25].map(x => Math.max(p.goal, Math.round(p.kg*(1-x)*10)/10)); m.push(p.goal); return m; }
function setsFor(ex, idx, tp, w){
  const base = ex[1], fin = ex[7];
  if (fin && (tp==="Technik" || (tp==="Fundament" && w < 3) || tp==="Urlaub")) return 0;
  if (tp==="Technik") return Math.max(1, base-1);
  if (tp==="Deload") return Math.max(1, Math.ceil(base/2));
  if (tp==="Volumen" && idx < 2) return 4;
  return base;
}

function rolling7(date){ const v=[]; for (let i=0;i<7;i++){ const x = S.days[addDays(date,-i)]?.w; if (typeof x==="number") v.push(x);} return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function rateAt(w){
  if (w < 5) return null; const a = weekAvg(w), b = weekAvg(w-4); if (a==null || b==null) return null;
  let n = 0; for (let i=w-3;i<=w;i++) if (isDef(i)) n++; if (!n) return null; return (b-a)/b/n;
}
function currentRate(){ const cw = Math.min(weekOf(todayISO()), 52); for (let w=cw; w>=5; w--){ const r=rateAt(w); if (r!=null) return r; } return null; }
function rollingK(date, k){ const v=[]; for (let i=0;i<7;i++){ const x = S.days[addDays(date,-i)]?.[k]; if (typeof x==="number") v.push(x);} return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function kfaTrend(){ const ds = Object.keys(S.days).filter(d=>typeof S.days[d].kfa==="number").sort(); return ds.length ? rollingK(ds[ds.length-1], "kfa") : null; }
function firstKfa(){ const ds = Object.keys(S.days).filter(d=>typeof S.days[d].kfa==="number").sort(); return ds.length ? S.days[ds[0]].kfa : null; }
let chartMode = "w";
function lastWeight(){ const ds = Object.keys(S.days).filter(d=>typeof S.days[d].w==="number").sort(); return ds.length ? ds[ds.length-1] : null; }
function trend(){ const d = lastWeight(); return d ? rolling7(d) : null; }
function weekStats(w){
  const p = P(), ds = weekDates(w).map(d=>S.days[d]||{}), kg = kcalGoal(w);
  const tracked = ds.filter(d=>typeof d.kcal==="number" && d.kcal>0).length;
  const inK = ds.filter(d=>typeof d.kcal==="number" && d.kcal>=kg*0.9 && d.kcal<=kg*1.1).length;
  const prot = ds.filter(d=>typeof d.p==="number" && d.p>=p.protein*0.9).length;
  const kraft = ds.filter(d=>d.kraft).length, sport = ds.filter(d=>d.sport).length;
  const st = ds.map(d=>d.steps).filter(x=>typeof x==="number"); const stAvg = st.length ? st.reduce((a,b)=>a+b,0)/st.length : null;
  const wp = ds.reduce((a,d)=>a+(typeof d.wp==="number"?d.wp:0)+(typeof d.cardio==="number"?d.cardio:0),0);
  const sl = ds.map(d=>d.sleep).filter(x=>typeof x==="number"); const slAvg = sl.length ? sl.reduce((a,b)=>a+b,0)/sl.length : null;
  const enDays = ds.filter(d=>typeof d.en==="number").length;
  const alc = ds.filter(d=>d.alc).length;
  const review = S.checkins[String(w)] ? 10 : 0;
  const pE = Math.min(tracked/7,1)*15 + Math.min(inK/7,1)*10 + Math.min(prot/7,1)*10;
  const pT = Math.min((kraft+sport)/(p.kraft+p.sport),1)*20;
  const pB = (stAvg==null?0:Math.min(stAvg/stepGoal(w),1)*14) + Math.min(wp/wpGoal(w),1)*6;
  const pS = (slAvg==null?0:Math.min(slAvg/p.sleep,1)*10) + Math.min(enDays/7,1)*5;
  const total = Math.round(pE+pT+pB+pS+review);
  const has = tracked>0 || ds.some(d=>typeof d.w==="number");
  const ph = phase(w);
  const amp = ph==="Urlaub" ? "u" : !has ? "" : total>=85 ? "g" : total>=70 ? "y" : "r";
  return { w, avg:weekAvg(w), tracked, inK, prot, kraft, sport, stAvg, wp, slAvg, alc, review, pE, pT, pB, pS, total, amp, has, ph };
}

async function writeDoc(kind, id, data){
  if (kind === "profile") S.profile = data;
  else S[kind][id] = data;
  S.pending.delete(kind + "/" + id);
  persistLocal();
}
function readSetupHash(){
  const m = location.hash.match(/^#setup=([A-Za-z0-9_-]+)$/);
  if (!m) return null;
  try {
    let b = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "=";
    const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    return (o && typeof o === "object" && PEOPLE[o.tmpl]) ? o : null;
  } catch(e){ return null; }
}
function applyPerson(){ document.body.dataset.tint = P().tmpl; }
async function initStore(){
  S.mode = "device";
  const L = lsGet(KEY);
  if (L){ Object.assign(S, {profile:L.profile||null, days:L.days||{}, sessions:L.sessions||{}, measures:L.measures||{}, checkins:L.checkins||{}}); }
  const setup = readSetupHash();
  if (setup){
    const keep = S.profile || {};
    S.profile = Object.assign({}, keep, setup, keep.startWeight != null && setup.startWeight == null ? {startWeight:keep.startWeight} : {});
    persistLocal();
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e){ location.hash = ""; }
    setTimeout(() => toast("Eingerichtet für " + (S.profile.name || "dich")), 300);
  }
  S.profileKnown = true; applyPerson(); renderAll();
  if (!S.profile) openOnboarding();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  if ("serviceWorker" in navigator && location.protocol === "https:"){ try { navigator.serviceWorker.register("sw.js"); } catch(e){} }
  const lastBackup = lsGet("formkurve.backupAt") || 0;
  if (Object.keys(S.days).length > 14 && Date.now() - lastBackup > 30*864e5){ S.syncNote = "Letzte Sicherung ist über 30 Tage her. Unter Mehr → Sicherung exportieren."; renderAll(); }
}

  closeSheet(true);

      <input type="time" data-f="t" value="${esc(x.t)}" aria-label="Uhrzeit">
      <select data-f="u" aria-label="Training">${opts().map(([u,n]) => `<option value="${u}" ${u===x.u?"selected":""}>${esc(n)}</option>`).join("")}</select>
      <button type="button" class="del" aria-label="Entfernen">−</button></div>`).join("") : `<div class="row"><span class="lbl" style="color:var(--label2)">Noch keine festen Tage</span></div>`;
    $$(".sched", sh).forEach(r => { const i = Number(r.dataset.i);
      $$("[data-f]", r).forEach(f => f.onchange = () => { list[i][f.dataset.f] = f.dataset.f === "wd" ? Number(f.value) : f.value; });
      $(".del", r).onclick = () => { list.splice(i,1); draw(sh); }; });
  };
  openSheet({title:"Trainingstage", right:"Sichern", body:`
    <div class="section"><div class="section-h">Feste Termine</div><div class="group" id="sc-list"></div>
      <div class="group" style="margin-top:8px"><button type="button" class="row tap" id="sc-add" style="width:100%;text-align:left"><span class="lbl link">+ Termin hinzufügen</span></button></div>
      <div class="section-f">Die App schlägt an diesen Tagen die passende Einheit vor und zeigt sie unter Heute.</div></div>
    <div class="section"><div class="section-h">Erinnerungen im Kalender</div><div class="group">
      <label class="row" for="sc-rem"><span class="lbl">Vorlauf</span><select id="sc-rem" class="field" style="width:auto">${[0,15,30,60,120].map(m => `<option value="${m}" ${m===p.remind?"selected":""}>${m ? m + " min vorher" : "zur Startzeit"}</option>`).join("")}</select></label>
      <label class="row" for="sc-wo"><span class="lbl">Tägliche Wiege-Erinnerung</span><input type="checkbox" class="switch" id="sc-wo" ${p.weighOn?"checked":""}></label>
      <label class="row" for="sc-wa"><span class="lbl">Uhrzeit Wiegen</span><input type="time" class="field" style="width:110px" id="sc-wa" value="${esc(p.weighAt)}"></label>
      <label class="row" for="sc-ci"><span class="lbl">Sonntags Check-in<small>19:00 Uhr</small></span><input type="checkbox" class="switch" id="sc-ci" ${p.checkinOn?"checked":""}></label></div></div>`,
    onOpen: sh => { draw(sh); $("#sc-add", sh).onclick = () => { list.push({wd:1, t:"18:00", u:"A"}); draw(sh); }; },
    onSave: sh => {
      list.sort((a,b) => WD_ORDER.indexOf(a.wd) - WD_ORDER.indexOf(b.wd) || a.t.localeCompare(b.t));
      saveProfile({schedule:list, remind:Number($("#sc-rem", sh).value), weighOn:$("#sc-wo", sh).checked, weighAt:$("#sc-wa", sh).value || "06:45", checkinOn:$("#sc-ci", sh).checked});
      toast("Gesichert");
    }});
}
function openTrips(){
  const p = P(), today = todayISO(); let list = p.trips.map(x => Object.assign({}, x));
  const draw = sh => {
    $("#tr-list", sh).innerHTML = list.length ? list.map((x,i) => `<div class="sched trip" data-i="${i}">
      <input type="date" data-f="from" value="${esc(x.from)}" aria-label="Von"><input type="date" data-f="to" value="${esc(x.to)}" aria-label="Bis">
      <button type="button" class="del" aria-label="Entfernen">−</button></div>`).join("") : `<div class="row"><span class="lbl" style="color:var(--label2)">Noch nichts eingetragen</span></div>`;
    $$(".sched", sh).forEach(r => { const i = Number(r.dataset.i);
      $$("[data-f]", r).forEach(f => f.onchange = () => { list[i][f.dataset.f] = f.value; if (f.dataset.f==="from" && (!list[i].to || list[i].to < f.value)){ list[i].to = f.value; draw(sh); } });
      $(".del", r).onclick = () => { list.splice(i,1); draw(sh); }; });
  };
  openSheet({title: p.tmpl==="m" ? "Dienstreisen" : "Tage zu Hause", right:"Sichern", body:`
    <div class="section"><div class="section-h">Zeiträume · von / bis</div><div class="group" id="tr-list"></div>
      <div class="group" style="margin-top:8px"><button type="button" class="row tap" id="tr-add" style="width:100%;text-align:left"><span class="lbl link">+ Zeitraum hinzufügen</span></button></div>
      <div class="section-f">${p.tmpl==="m" ? "An Reisetagen schlägt die App „Reise“ vor: 6 Übungen nur mit Körpergewicht und Rucksack, ca. 30 Minuten im Hotelzimmer." : "An diesen Tagen schlägt die App „Zuhause“ vor: 6 Übungen ohne Geräte, ca. 25 Minuten – gut, wenn die Kinder schlafen."} Im Kalender-Export werden feste Studiotermine dann durch dieses Programm ersetzt.</div></div>`,
    onOpen: sh => { draw(sh); $("#tr-add", sh).onclick = () => { list.push({from:today, to:addDays(today,2)}); draw(sh); }; },
    onSave: sh => {
      list = list.filter(x => x.from && x.to).map(x => x.to < x.from ? {from:x.to, to:x.from} : x).sort((a,b) => a.from.localeCompare(b.from));
      saveProfile({trips:list}); toast("Gesichert");
    }});
}
function doICS(){
  const p = P(), today = todayISO(), from = today > p.startDate ? today : p.startDate, end = addDays(p.startDate, 52*7 - 1);
  const ics = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const dt = (d, t) => d.replace(/-/g,"") + "T" + t.replace(":","") + "00";
  const addMin = (t, m) => { const x = Number(t.slice(0,2))*60 + Number(t.slice(3,5)) + m; return [Math.floor(x/60)%24, x%60].map(n => String(n).padStart(2,"0")).join(":"); };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Formkurve//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Formkurve " + ics(p.person)];
  let n = 0;
  const ev = (d, t, mins, title, desc, alarm, rrule) => {
    n++; L.push("BEGIN:VEVENT", `UID:fk-${p.tmpl}-${d}-${t.replace(":","")}-${n}@formkurve`, "DTSTAMP:" + stamp, "DTSTART:" + dt(d,t), "DTEND:" + dt(d, addMin(t, mins)), "SUMMARY:" + ics(title));
    if (rrule) L.push("RRULE:" + rrule + ";UNTIL=" + dt(end, "23:59"));
    if (desc) L.push("DESCRIPTION:" + ics(desc));
    if (alarm != null) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + ics(title), "TRIGGER:-PT" + alarm + "M","END:VALARM");
    L.push("END:VEVENT");
  };
  const exText = u => u === "S" ? "" : EX[p.tmpl][u].map(e => `• ${e[0]} ${e[1]}×${e[2]}–${e[3]}${e[9] ? " " + e[9] : ""}`).join("\n") + `\n\nDanach: ${CARDIO[p.tmpl][u].t}, ${CARDIO[p.tmpl][u].min} min`;
  for (let d = from; d <= end; d = addDays(d,1)){
    if (d >= p.vacFrom && d <= p.vacTo) continue;
    const trip = inTrip(d);
    p.schedule.filter(x => x.wd === dow(d)).forEach(x => {
      let u = x.u; if (trip && u !== "S") u = "D";
      const mins = u === "S" ? 90 : UNITS[p.tmpl][u].min + CARDIO[p.tmpl][u].min;
      ev(d, x.t, mins, (u === "S" ? "🥊 " : "🏋️ ") + unitName(u) + " · Formkurve", exText(u), p.remind);
    });
  }
  if (p.weighOn) ev(from, p.weighAt, 5, "⚖️ Wiegen & eintragen", "Nach dem Aufstehen, vor Essen und Trinken. Gewicht und Körperfett in Formkurve eintragen.", 0, "FREQ=DAILY");
  if (p.checkinOn){ let su = from; while (dow(su) !== 0) su = addDays(su,1); ev(su, "19:00", 15, "📋 Wochen-Check-in", "Formkurve öffnen → Heute → Wochen-Check-in.", 0, "FREQ=WEEKLY;BYDAY=SU"); }
  L.push("END:VCALENDAR");
  if (!n){ toast("Keine Termine – erst Trainingstage eintragen"); return; }
  const fold = l => { const c = Array.from(l), o = []; for (let i = 0; i < c.length; i += 60) o.push(c.slice(i, i+60).join("")); return o.join("\r\n "); };
  offerFile(`Formkurve_${p.person}.ics`, L.map(fold).join("\r\n"), "text/calendar").then(ok => { if (ok) toast(n + " Termine exportiert"); });
}
function openOnboarding(isReset){
  if (document.querySelector(".sheet")) return;
  const pr = S.profile || {};
  let pick = pr.tmpl || null;
  openSheet({title: isReset ? "Profil" : "Willkommen", left: isReset ? "Abbrechen" : "", right:"Los geht’s", body:`
    <h2 style="font-size:28px;font-weight:700;letter-spacing:.36px;margin:12px 4px 6px">Formkurve einrichten</h2>
    <p class="note" style="margin:0 4px 18px;font-size:15px">Am schnellsten mit deinem persönlichen Einrichtungslink – dann ist alles schon ausgefüllt. Oder hier von Hand:</p>
    <div class="section"><div class="section-h">Name</div><div class="group"><div class="row"><input class="field wide" id="ob-name" placeholder="Vorname" value="${esc(pr.name||"")}" autocomplete="given-name"></div></div></div>
    <div class="section"><div class="section-h">Trainingsplan</div>
      <div class="who">${["m","w"].map(t => `<button type="button" data-p="${t}" aria-pressed="${pick===t}"><span class="avatar" style="background:var(--${t==="m"?"roman":"alina"})">${t.toUpperCase()}</span><b>${esc(PEOPLE[t].label.split(" · ")[1])}</b><span class="note">${fmt(PEOPLE[t].kcal.Defizit)} kcal · ${PEOPLE[t].protein} g Protein</span></button>`).join("")}</div></div>
    <div class="section"><div class="section-h">Körper</div><div class="group">
      <label class="row" for="ob-cm"><span class="lbl">Größe</span><input class="field num" id="ob-cm" inputmode="decimal" placeholder="0" value="${pr.cm!=null?esc(fmt(pr.cm,1)):""}"><span class="unit">cm</span></label>
      <label class="row" for="ob-kg"><span class="lbl">Startgewicht</span><input class="field num" id="ob-kg" inputmode="decimal" placeholder="0,0" value="${pr.startWeight!=null?esc(fmt(pr.startWeight,2)):""}"><span class="unit">kg</span></label>
      <label class="row" for="ob-goal"><span class="lbl">Wunschgewicht</span><input class="field num" id="ob-goal" inputmode="decimal" placeholder="0,0" value="${pr.goal!=null?esc(fmt(pr.goal,1)):""}"><span class="unit">kg</span></label></div>
      <div class="section-f">Startgewicht am Starttag morgens nüchtern – lässt sich später unter Mehr ändern.</div></div>`,
    onOpen: s => $$(".who button", s).forEach(b => b.onclick = () => { pick = b.dataset.p; $$(".who button", s).forEach(x=>x.setAttribute("aria-pressed", String(x===b))); document.body.dataset.tint = pick; }),
    onSave: s => {
      const name = $("#ob-name", s).value.trim();
      if (!name){ toast("Bitte einen Namen eingeben"); return false; }
      if (!pick){ toast("Bitte einen Trainingsplan wählen"); return false; }
      const o = Object.assign({startDate:DEFAULTS.startDate, vacFrom:DEFAULTS.vacFrom, vacTo:DEFAULTS.vacTo}, pr, {name, tmpl:pick});
      const cm = parseNum($("#ob-cm", s).value), kg = parseNum($("#ob-kg", s).value), goal = parseNum($("#ob-goal", s).value);
      if (cm != null) o.cm = cm; if (kg != null) o.startWeight = kg; if (goal != null) o.goal = goal;
      writeDoc("profile","me", o); applyPerson(); renderAll(); toast("Hallo " + name);
    }});
}
async function offerFile(name, text, mime){
  const blob = new Blob([text], {type: mime});
  try {
    const file = new File([blob], name, {type: mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  } catch(e){ if (e && e.name === "AbortError") return false; }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch(e){}
  openSheet({title:"Export", left:"", right:"Fertig", body:`<p class="note" style="margin:8px 4px">Text kopieren und einfügen.</p>
    <div class="group"><div class="row"><textarea class="field wide" id="exp-t" rows="10" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(text.replace(/^﻿/,""))}</textarea></div></div>
    <div class="section"><button class="btn" id="exp-copy">Kopieren</button></div>`,
    onOpen: sh => { $("#exp-copy", sh).onclick = async () => { const t = $("#exp-t", sh); try { await navigator.clipboard.writeText(t.value); toast("Kopiert"); } catch(e){ t.focus(); t.select(); toast("Text markiert"); } }; }});
  return false;
}
async function doBackup(){
  const data = JSON.stringify({app:"formkurve", version:1, exportedAt:new Date().toISOString(), profile:S.profile, days:S.days, sessions:S.sessions, measures:S.measures, checkins:S.checkins});
  const ok = await offerFile(`Formkurve-Sicherung_${todayISO()}.json`, data, "application/json");
  if (ok){ lsSet("formkurve.backupAt", Date.now()); if (S.syncNote.startsWith("Letzte Sicherung")) S.syncNote = ""; renderAll(); toast("Sicherung erstellt"); }
}
function doRestore(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(r.result); } catch(e){ toast("Datei ist keine Sicherung"); return; }
    if (!o || o.app !== "formkurve"){ toast("Datei ist keine Formkurve-Sicherung"); return; }
    const n = Object.keys(o.days || {}).length;
    openSheet({title:"Sicherung laden", right:"Ersetzen", body:`<div class="card" style="margin-top:8px"><h3>${esc(o.profile?.name || "Unbekannt")}</h3>
      <p class="meta">${n} Tage · ${Object.keys(o.sessions||{}).length} Trainings · gesichert am ${esc(String(o.exportedAt||"").slice(0,10))}</p></div>
      <p class="note" style="margin:12px 4px">Alle Einträge auf diesem iPhone werden durch die Sicherung ersetzt.</p>`,
      onSave: () => { Object.assign(S, {profile:o.profile||null, days:o.days||{}, sessions:o.sessions||{}, measures:o.measures||{}, checkins:o.checkins||{}}); persistLocal(); applyPerson(); builtDate = null; builtTrain = null; renderAll(); toast("Sicherung geladen"); }});
  };
  r.readAsText(file);
}
async function doExport(kind){
  const p = P(), num = (v, d) => v==null ? "" : fmt(v, d).replace(/\./g, ""), rows = [];
  let name;
  if (kind === "tag"){
    name = `Tageslog_${p.person}.csv`;
    rows.push(["Datum","Gewicht","kcal","Protein","Schritte","Walking Pad","Kraft","Sport","Alkohol","Schlaf","Schlafqualität","Energie","Hunger","Stress","RR sys","RR dia", p.extra.label, "Notiz", "KFA %"]);
    const end = todayISO();
    for (let d = p.startDate; d <= end; d = addDays(d,1)){
      const o = S.days[d] || {};
      rows.push([dateNum(d), num(o.w,2), num(o.kcal,0), num(o.p,0), num(o.steps,0), num(o.wp,0), o.kraft!=null?String(o.kraft):"", o.sport!=null?String(o.sport):"", o.alc!=null?String(o.alc):"",
        num(o.sleep,1), num(o.sq,0), num(o.en,0), num(o.hu,0), num(o.st,0), num(o.sys,0), num(o.dia,0), p.extra.type==="switch" ? (o[p.extra.k]!=null?String(o[p.extra.k]):"") : num(o[p.extra.k],0), o.note||"", num(o.kfa,1)]);
    }
  } else if (kind === "training"){
    name = `Trainingslog_${p.person}.csv`;
    rows.push(["Datum","Person","Übung","Gewicht (kg)","Wdh Satz 1","Wdh Satz 2","Wdh Satz 3","RIR letzter Satz","Schmerz 0–10","Notiz"]);
    Object.keys(S.sessions).sort().forEach(k => { const s = S.sessions[k];
      for (const [n, e] of Object.entries(s.ex||{})){ const r = e.r || []; if (e.w==null && !r.some(x=>x!=null)) continue;
        rows.push([dateNum(s.date), p.person, n, num(e.w,1), num(r[0],0), num(r[1],0), num(r[2],0), "", num(e.pain,0), r[3]!=null ? "Satz 4: " + r[3] : ""]); } });
  } else {
    name = `Masse_${p.person}.csv`;
    rows.push(["Datum"].concat(MFIELDS.map(m=>m[1])));
    Object.keys(S.measures).sort().forEach(k => { const m = S.measures[k]; rows.push([dateNum(k)].concat(MFIELDS.map(([f]) => num(m[f],1)))); });
  }
  if (rows.length < 2){ toast("Noch keine Daten"); return; }
  const csv = "﻿" + rows.map(r => r.map(c => /[;"\n]/.test(c) ? `"${String(c).replace(/"/g,'""')}"` : c).join(";")).join("\r\n");
  if (await offerFile(name, csv, "text/csv")) toast("Exportiert");
}

/* =================== Navigation =================== */
function setTab(t){
  S.tab = t; lsSet("trafo.tab", t);
  ["heute","training","fortschritt","mehr"].forEach(x => { $("#s-"+x).hidden = x !== t; $("#t-"+x).setAttribute("aria-selected", String(x===t)); });
  renderAll(true); window.scrollTo(0,0);
}
function renderAll(){
  const t = S.tab;
  if (t === "heute") renderHeute(false);
  if (t === "training") renderTraining(false);
  if (t === "fortschritt" && !document.querySelector("#s-fortschritt :focus")) renderFortschritt();
  if (t === "mehr") renderMehr();
}
$$(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
const savedTab = lsGet("trafo.tab"); if (["heute","training","fortschritt","mehr"].includes(savedTab)) S.tab = savedTab;
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.date > todayISO()) S.date = todayISO(); });

applyPerson();
setTab(S.tab);
initStore();
})();

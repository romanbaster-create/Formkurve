  const ys = pts.map(d=>S.days[d].w).concat(scen.map(s=>s.y), [p.kg]);
  let lo = Math.floor(Math.min(...ys) - 1), hi = Math.ceil(Math.max(...ys) + 1);
  if (hi - lo < 6){ lo = hi - 6; }
  const X = days => L + (days/(lastW*7)) * (W-L-Rr), Y = v => T + (hi - v)/(hi-lo) * (H-T-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf mit Basis-Szenario">`;
  const step = (hi-lo) > 16 ? 5 : 2;
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step){ s += `<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)" stroke-width=".5"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--label2)">${v}</text>`; }
  const months = []; for (let i=0;i<=lastW*7;i+=1){ const d = addDays(p.startDate,i); if (d.endsWith("-01")) months.push([i,d]); }
  months.forEach(([i,d]) => { s += `<text x="${X(i)}" y="${H-6}" font-size="10" fill="var(--label2)" text-anchor="middle">${MON[Number(d.slice(5,7))-1].replace(".","")}</text>`; });
  const vf = diffDays(p.startDate, p.vacFrom), vt = diffDays(p.startDate, p.vacTo);
  if (vf < lastW*7) s += `<rect x="${X(vf)}" y="${T}" width="${Math.max(2, X(Math.min(vt,lastW*7))-X(vf))}" height="${H-T-B}" fill="var(--teal)" opacity=".12"/>`;

function kfaChartSVG(){
  const p = P(), today = todayISO(), cw = clamp(weekOf(today),1,52), lastW = Math.max(12, Math.min(52, cw + 6));
  const W = 340, H = 190, L = 30, Rr = 8, T = 12, B = 22;
  const pts = Object.keys(S.days).filter(d => typeof S.days[d].kfa === "number" && d >= p.startDate).sort();
  if (!pts.length) return `<div class="empty-chart">Noch kein Körperfett eingetragen. Trag den Wert deiner Waage unter Heute → Körperfett ein – am besten immer gleich: morgens, nüchtern, barfuß.</div>`;
  const ys = pts.map(d=>S.days[d].kfa); let lo = Math.floor(Math.min(...ys) - 1), hi = Math.ceil(Math.max(...ys) + 1); if (hi - lo < 4) lo = hi - 4;
  const X = days => L + (days/(lastW*7)) * (W-L-Rr), Y = v => T + (hi - v)/(hi-lo) * (H-T-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Körperfettverlauf">`;
  const step = (hi-lo) > 10 ? 2 : 1;
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step){ s += `<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)" stroke-width=".5"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--label2)">${v}</text>`; }
  for (let i=0;i<=lastW*7;i++){ const d = addDays(p.startDate,i); if (d.endsWith("-01")) s += `<text x="${X(i)}" y="${H-6}" font-size="10" fill="var(--label2)" text-anchor="middle">${MON[Number(d.slice(5,7))-1].replace(".","")}</text>`; }
  pts.forEach(d => { s += `<circle cx="${X(diffDays(p.startDate,d)).toFixed(1)}" cy="${Y(S.days[d].kfa).toFixed(1)}" r="2.2" fill="var(--orange)" opacity=".4"/>`; });
  const avg = pts.map(d => [diffDays(p.startDate,d), rollingK(d,"kfa")]);
  if (avg.length > 1) s += `<polyline fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${avg.map(([i,v])=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}"/>`;
  const [li, lv] = avg[avg.length-1]; s += `<circle cx="${X(li).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="4.5" fill="var(--orange)" stroke="var(--card)" stroke-width="2"/>`;
  return s + `</svg>`;
}

function doICS(){
  const p = P(), today = todayISO(), from = today > p.startDate ? today : p.startDate, end = addDays(p.startDate, 52*7 - 1);
  const ics = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const dt = (d, t) => d.replace(/-/g,"") + "T" + t.replace(":","") + "00";
  const addMin = (t, m) => { const x = Number(t.slice(0,2))*60 + Number(t.slice(3,5)) + m; return [Math.floor(x/60)%24, x%60].map(n => String(n).padStart(2,"0")).join(":"); };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Formkurve//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Formkurve " + ics(p.person)];
  let n = 0;
  const ev = (d, t, mins, title, desc, alarm, rrule) => {
    n++; L.push("BEGIN:VEVENT", `UID:fk-${p.tmpl}-${d}-${t.replace(":","")}-${n}@formkurve`, "DTSTAMP:" + stamp, "DTSTART:" + dt(d,t), "DTEND:" + dt(d, addMin(t, mins)), "SUMMARY:" + ics(title));
    if (rrule) L.push("RRULE:" + rrule + ";UNTIL=" + dt(end, "23:59"));
    if (desc) L.push("DESCRIPTION:" + ics(desc));
    if (alarm != null) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + ics(title), "TRIGGER:-PT" + alarm + "M","END:VALARM");
    L.push("END:VEVENT");
  };
  const exText = u => u === "S" ? "" : EX[p.tmpl][u].map(e => `• ${e[0]} ${e[1]}×${e[2]}–${e[3]}${e[9] ? " " + e[9] : ""}`).join("\n") + `\n\nDanach: ${CARDIO[p.tmpl][u].t}, ${CARDIO[p.tmpl][u].min} min`;
  for (let d = from; d <= end; d = addDays(d,1)){
    if (d >= p.vacFrom && d <= p.vacTo) continue;
    const trip = inTrip(d);
    p.schedule.filter(x => x.wd === dow(d)).forEach(x => {
      let u = x.u; if (trip && u !== "S") u = "D";
      const mins = u === "S" ? 90 : UNITS[p.tmpl][u].min + CARDIO[p.tmpl][u].min;
      ev(d, x.t, mins, (u === "S" ? "🥊 " : "🏋️ ") + unitName(u) + " · Formkurve", exText(u), p.remind);
    });
  }
  if (p.mods.cycle){ const c = cycleData(); c.preds.slice(0,3).forEach(d => ev(d, "08:00", 15, "🩸 Periode erwartet (Prognose)", "In Formkurve unter Leben bestätigen, wenn sie begonnen hat.", 0)); }
  ev(from, p.reviewAt, 10, "🌙 Tagesabschluss · Formkurve", "Alles eingetragen? Top 3 erledigt? Morgen planen.", 0, "FREQ=DAILY");
  if (p.mods.read) ev(from, addMin(p.reviewAt, 15), 30, "📖 " + p.readGoal + " Seiten lesen", "Handy weg, Buch auf.", 0, "FREQ=DAILY");
  if (p.mods.focus) ev(from, "07:30", 5, "🎯 Top 3 für heute festlegen", "Formkurve → Übersicht → Die 3 wichtigsten Dinge.", 0, "FREQ=DAILY");
  if (p.weighOn) ev(from, p.weighAt, 5, "⚖️ Wiegen & eintragen", "Nach dem Aufstehen, vor Essen und Trinken. Gewicht und Körperfett in Formkurve eintragen.", 0, "FREQ=DAILY");
  if (p.checkinOn){ let su = from; while (dow(su) !== 0) su = addDays(su,1); ev(su, "19:00", 15, "📋 Wochen-Check-in", "Formkurve öffnen → Heute → Wochen-Check-in.", 0, "FREQ=WEEKLY;BYDAY=SU"); }
  L.push("END:VCALENDAR");
  if (!n){ toast("Keine Termine – erst Trainingstage eintragen"); return; }
  const fold = l => { const c = Array.from(l), o = []; for (let i = 0; i < c.length; i += 60) o.push(c.slice(i, i+60).join("")); return o.join("\r\n "); };
  offerFile(`Formkurve_${p.person}.ics`, L.map(fold).join("\r\n"), "text/calendar").then(ok => { if (ok) toast(n + " Termine exportiert"); });
}

  const me = {n:p.person, k:kcalGoal(w)*cat[1], p:p.protein*cat[1], me:true, c:1};
  return [me].concat(household().map(x => ({n:x.n, k:x.k*cat[1], p:(x.p || estimateNeeds(x).p)*cat[1], kid:x.kid, c: r.cat === "h" && x.on !== false ? 1 : 0})));
}
function cookPlan(r, people, mode, inputs){
  const T = recTotals(r), need = people.reduce((a,x) => a + x.c*x.k, 0), f = need > 0 ? need / T.k : 1;
  const comps = mode === "pot" ? [{l:"Gericht", idx:r.ing.map((_,i) => i), m:"w", n:0}] : recComps(r);
  const res = comps.map(c => {
    const K = c.idx.reduce((a,i) => a + entryVals(r.ing[i]).k, 0)*f, Pp = c.idx.reduce((a,i) => a + entryVals(r.ing[i]).p, 0)*f, raw = c.idx.reduce((a,i) => a + r.ing[i].g, 0)*f;
    const inp = inputs[c.l] || {}, m = inp.m || c.m, W = inp.W || null, N = inp.N || (m === "p" ? Math.max(1, Math.round((c.n || r.serv) * f / ((c.n || r.serv) / (c.n || r.serv)))) : 0);
    const protein = K > 0 && Pp*4/K >= 0.35;
    const base = people.map(x => x.c * (protein ? x.p : x.k)), sum = base.reduce((a,b) => a+b, 0) || 1;
    const share = base.map(b => b/sum);
    let pcs = null; if (m === "p"){ const nN = inp.N || Math.max(1, Math.round((c.n || r.serv) * f)); const ex = share.map(sv => sv*nN), fl = ex.map(Math.floor); let left = nN - fl.reduce((a,b)=>a+b,0);
      ex.map((v,i) => [v - fl[i], i]).sort((a,b) => b[0]-a[0]).forEach(([,i]) => { if (left > 0 && people[i].c > 0){ fl[i]++; left--; } }); pcs = fl; c.N = nN; }
    return {l:c.l, m, W: W || raw, Wset: !!W, raw, K, P:Pp, protein, share, pcs, N: m === "p" ? (inp.N || Math.max(1, Math.round((c.n || r.serv) * f))) : 0};
  });
  const plates = people.map((x,i) => { if (!x.c) return null; let k = 0, pr = 0, g = 0; const items = res.map(c => { const gg = c.W*c.share[i]/x.c; k += c.K*c.share[i]/x.c; pr += c.P*c.share[i]/x.c; g += gg;
      return {l:c.l, g:gg, pcs: c.pcs ? c.pcs[i]/x.c : null}; }); return {n:x.n, me:x.me, c:x.c, k, p:pr, g, items}; });

}

function parseHealth(txt){
  const out = {}; if (!txt) return out;
  const num = v => { const m = String(v).replace(/\s/g,"").replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
  String(txt).split(/[|;\n]+/).forEach(part => { const m = part.match(/^\s*([a-zäöü]+)\s*[=:]\s*(.+)$/i); if (!m) return;
    const k = m[1].toLowerCase(), v = m[2].trim();
    if (k === "d" || k === "datum"){ const dm = v.match(/(\d{4})-(\d{2})-(\d{2})/) || v.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (dm) out.d = dm[0].includes("-") ? dm[0] : `${dm[3]}-${String(dm[2]).padStart(2,"0")}-${String(dm[1]).padStart(2,"0")}`; return; }
    let n = num(v); if (n == null) return;
    if (k === "steps" || k === "schritte"){ const raw = v.replace(/\s/g,"").match(/[\d.,]+/); if (raw && /^\d{1,3}([.,]\d{3})+$/.test(raw[0])) n = Number(raw[0].replace(/[.,]/g,"")); out.steps = Math.round(n); }
    else if (k === "w" || k === "gewicht"){ if (/lb/i.test(v)) n *= 0.4536; if (n > 25 && n < 300) out.w = r1(n*10)/10 === n ? n : Math.round(n*100)/100; }
    else if (k === "kfa" || k === "fett"){ if (n > 0 && n < 1) n *= 100; if (n > 2 && n < 70) out.kfa = r1(n); }
    else if (k === "sleep" || k === "schlaf"){ if (n > 24) n = n/60; if (n > 0 && n <= 16) out.sleep = r1(n); }
    else if (k === "kcal") out.kcal = Math.round(n);
    else if (k === "p" || k === "protein") out.p = Math.round(n);
  });
  return out;
}
function applyHealth(h){

  if (!keys.length){ toast("Keine Health-Daten erkannt"); return false; }
  const d = h.d && h.d <= todayISO() ? h.d : todayISO(), o = S.days[d] || (S.days[d] = {});
  keys.forEach(k => { if ((k === "kcal" || k === "p") && (o.food||[]).length) return; o[k] = h[k]; });

  toast("Übernommen: " + keys.map(k => L[k]).join(", ")); return true;
}

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsprognose">`;
  const st = (hi-lo) > 20 ? 5 : 2; for (let v = Math.ceil(lo/st)*st; v <= hi; v += st) svg += `<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)" stroke-width=".5"/><text x="${L-6}" y="${Y(v)+3.5}" font-size="10" text-anchor="end" fill="var(--label2)">${v}</text>`;
  if (p.vacFrom > d0 && p.vacFrom < endD) svg += `<rect x="${X(p.vacFrom)}" y="${T}" width="${Math.max(3, X(p.vacTo < endD ? p.vacTo : endD) - X(p.vacFrom))}" height="${H-T-B}" fill="var(--teal)" opacity=".14"/><text x="${X(p.vacFrom)+3}" y="${T+10}" font-size="9" fill="var(--teal)">Urlaub</text>`;
  let lastM = -1; for (let i = 0; i <= span0; i += 7){ const d = addDays(d0, i), t = new Date(parseISO(d)), m = t.getUTCMonth(); if (m !== lastM && i > 10 && (m % (span0 > 400 ? 3 : 2) === 0)){ svg += `<text x="${X(d)}" y="${H-7}" font-size="10" fill="var(--label2)" text-anchor="middle">${MON[m].replace(".","")}${m===0 ? " " + String(t.getUTCFullYear()).slice(2) : ""}</text>`; } lastM = m; }
  const line = pts => pts.filter(o => o.d <= endD).map(o => `${X(o.d).toFixed(1)},${Y(o.kg).toFixed(1)}`);
  svg += `<polygon points="${line(F).concat(line(Sl).reverse()).join(" ")}" fill="var(--tint)" opacity=".13"/>`;
  svg += `<line x1="${L}" x2="${W-Rr}" y1="${Y(p.goal)}" y2="${Y(p.goal)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  svg += `<polyline points="${line(C).join(" ")}" fill="none" stroke="var(--tint)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  ms.filter(m => !m.goal && m.i === "🎯").forEach(m => { const d = whenKg(C, m.kg); if (d && d <= endD) svg += `<circle cx="${X(d).toFixed(1)}" cy="${Y(m.kg).toFixed(1)}" r="3.5" fill="var(--card)" stroke="var(--tint)" stroke-width="2"/>`; });
  svg += `<circle cx="${X(d0)}" cy="${Y(cur)}" r="5" fill="var(--tint)" stroke="var(--card)" stroke-width="2"/><circle cx="${X(goalD).toFixed(1)}" cy="${Y(p.goal).toFixed(1)}" r="5" fill="var(--green)" stroke="var(--card)" stroke-width="2"/></svg>`;
  const vacKg = p.vacFrom > today ? kgAt(C, p.vacFrom) : null;
  const fatLost = kt != null && firstKfa() != null ? Math.max(0, p.kg*firstKfa()/100 - cur*kt/100) : Math.max(0, lost*0.8);
  const nextDate = range(next.kg);
  const nextProg = clamp((prevMark - cur)/(prevMark - next.kg), 0, 1);
  el.innerHTML = `${banner()}
    <div class="nav"><span class="sub">${fr.real ? "Nach deinem echten Tempo" : "Nach Plan – ab Woche 5 mit deinem Tempo"}</span><span class="pill">${fmt(fr.base*100,2)} % / Woche</span></div>
    <h1 class="large-title">Ausblick</h1>
    <div class="hero next-hero"><div class="hero-k">Nächste Etappe</div>
      <div class="nh-t">${next.i} ${esc(next.t)}</div>
      <div class="nh-d">${nextDate.c ? esc(monY(nextDate.c)) : "–"}</div>
      <div class="nh-bar"><i style="width:${(nextProg*100).toFixed(0)}%"></i></div>
      <div class="nh-s">noch ${fmt(Math.max(0, cur - next.kg),1)} kg · aktuell ${fmt(cur,1)} kg${span(next.kg) ? " · Spanne " + esc(span(next.kg)) : ""}</div></div>
    <div class="bento">
      <div class="tilex goal"><div class="tk">Zielgewicht</div><div class="tv num" style="font-size:22px">${esc(monY(goalD).replace(" ", "<br>").replace(/<br>/,"\n"))}</div><div class="ts">${fmt(p.goal,1)} kg · in ca. ${fmt(Math.max(1, Math.round(diffDays(today, goalD)/7)))} Wochen</div></div>
      <div class="tilex vac"><div class="tk">Zum Urlaub</div><div class="tv num">${vacKg == null ? "–" : fmt(vacKg,1)}<small> kg</small></div><div class="ts">${vacKg == null ? "Urlaub liegt hinter dir" : "Prognose für " + esc(dateShort(p.vacFrom)) + " · " + fmtS(vacKg - cur,1) + " kg"}</div></div>
    </div>
    <div class="section"><div class="card chart"><div class="headline-row"><h3>Dein Weg in Zahlen</h3><span class="meta">Prognose ± Spanne</span></div>${svg}
      <p class="note" style="margin:8px 0 0">Rechnet mit ${fr.real ? "deinem gemessenen Tempo der letzten Wochen" : "dem Plan-Tempo"} in Defizitwochen. Erhaltungs- und Urlaubswochen halten das Gewicht. Je mehr Daten, desto genauer.</p></div></div>
    <div class="section"><div class="section-h"><span>Kleidergrößen</span></div>
      ${sizeRows.length ? sizeRows.map(r => `<div class="card size-card"><div class="row-h" style="margin-bottom:6px"><h3>${esc(r.dim.label)}</h3><span class="meta">heute ${esc(r.now)}</span></div>
        ${r.steps.length ? `<div class="size-steps">${r.steps.map(x => { const c = whenKg(C, x.kg); return `<div class="sz"><b>${esc(x.lab)}</b><span>${c ? esc(monY(c)) : "–"}</span><small>bei ca. ${fmt(x.kg,1)} kg</small></div>`; }).join("")}</div>` : `<p class="note">Bis zum Zielgewicht voraussichtlich keine kleinere Größe – oder du hast sie schon.</p>`}
        <div class="size-goal">Beim Zielgewicht: <b>${esc(r.atGoal)}</b></div></div>`).join("") :
        `<div class="card"><p class="note" style="margin:0 0 10px">Für die Größenprognose braucht die App deinen Taillenumfang${p.tmpl==="w" ? " und Hüftumfang" : " und Brustumfang"}. Einmal messen reicht für den Start – mit jeder weiteren Messung lernt die Prognose deinen Körper kennen.</p><button type="button" class="btn secondary" id="a-m">Maße eintragen</button></div>`}
      <div class="section-f">Schätzung über Umfang pro Kilo (${sizeRows.some(r => r.own) ? "aus deinen eigenen Messungen" : "Durchschnittswert, ab 3 kg Abnahme aus deinen Messungen"}). Größen schwanken je nach Marke um eine Nummer.</div></div>
    ${(() => { const thr = []; for (let v = Math.floor(p.kg/5)*5; v > cur; v -= 5) if (v < p.kg) thr.push([v, "🎯", "Unter " + v + " kg"]);
        [0.05,0.10,0.15,0.20].forEach(x => { const v = p.kg*(1-x); if (v >= cur) thr.push([v, "📉", "−" + Math.round(x*100) + " % Körpergewicht"]); });
        [[30,"BMI unter 30"],[27,"BMI unter 27"],[25,"BMI unter 25"]].forEach(([b,t]) => { const v = b*m2; if (v < p.kg && v >= cur) thr.push([v, "⚖️", t]); });
        const ds = Object.keys(S.days).filter(d => typeof S.days[d].w === "number" && d >= p.startDate).sort();
        const got = thr.map(([v,i,t]) => { const d = ds.find(d => (rolling7(d) ?? 999) <= v); return d ? {v,i,t,d} : null; }).filter(Boolean).sort((a,b) => a.d.localeCompare(b.d));
        return got.length ? `<div class="section"><div class="section-h"><span>Geschafft</span><span class="meta-s">${got.length}</span></div><div class="timeline">${got.map(g => `<div class="tl done"><span class="tl-i">✓</span><div class="tl-b"><b>${g.i} ${esc(g.t)}</b><small>erreicht nach ${diffDays(p.startDate, g.d)} Tagen</small></div><div class="tl-d"><b>${esc(dateShort(g.d))}</b><small>${fmt(g.v,1)} kg</small></div></div>`).join("")}</div></div>` : ""; })()}
    <div class="section"><div class="section-h"><span>Etappen</span><span class="meta" style="font-size:13px;font-weight:500;color:var(--label2)">${ms.length} vor dir</span></div>
      <div class="timeline">${ms.map((m, idx) => { const r = range(m.kg); return `<div class="tl ${m.goal ? "goal" : ""} ${idx >= 8 && !m.goal ? "more" : ""}"><span class="tl-i">${m.i}</span><div class="tl-b"><b>${esc(m.t)}</b><small>${esc(m.s)}</small></div><div class="tl-d"><b>${r.c ? esc(monS(r.c)) : "–"}</b><small>${fmt(m.kg,1)} kg</small></div></div>`; }).join("")}${ms.length > 9 ? `<button type="button" class="tl-more" id="a-more">Alle ${ms.length} Etappen zeigen</button>` : ""}</div>
      <button type="button" class="btn secondary" id="a-ach" style="margin-top:12px">🏆 Alle Erfolge ansehen</button>
      <div class="section-f">Monat = Prognose bei gleichem Tempo. Hältst du das Tempo, kommst du in der Spanne an. Wirst du schneller, früher.</div></div>
    <div class="section"><div class="section-h"><span>Was du schon gewonnen hast</span></div><div class="facts">
      <div class="fact"><b class="num">${fmt(Math.max(0,lost),1)} kg</b><span>weniger seit dem Start</span></div>
      <div class="fact"><b class="num">${fmt(Math.round(fatLost/0.25))}</b><span>Päckchen Butter Fett verbrannt (à 250 g)</span></div>
      <div class="fact"><b class="num">${fmt(Math.max(0,lost)*4,0)} kg</b><span>weniger Last auf den Knien bei jedem Schritt*</span></div>
      <div class="fact"><b class="num">${fmt(Math.max(0, p.goal ? (p.kg - p.goal) : 0)*4,0)} kg</b><span>Kniebelastung weniger pro Schritt beim Ziel*</span></div></div>
      <div class="section-f">* Faustregel aus einer Studie zu Kniearthrose: 1 kg weniger Körpergewicht ≈ 4 kg weniger Last auf dem Knie pro Schritt.</div></div>`;
  const am = $("#a-m", el); if (am) am.onclick = openMeasure;
  $("#a-ach", el).onclick = openAchievements;
  const mo = $("#a-more", el); if (mo) mo.onclick = () => { el.querySelector(".timeline").classList.add("all"); mo.remove(); };
}
function openOnboarding(isReset){
  if (document.querySelector(".sheet")) return;
  const pr = S.profile || {};
  let pick = pr.tmpl || null;
  openSheet({title: isReset ? "Profil" : "Willkommen", left: isReset ? "Abbrechen" : "", right:"Los geht’s", body:`
    <h2 style="font-size:28px;font-weight:700;letter-spacing:.36px;margin:12px 4px 6px">Formkurve einrichten</h2>
    <p class="note" style="margin:0 4px 18px;font-size:15px">Am schnellsten mit deinem persönlichen Einrichtungslink – dann ist alles schon ausgefüllt. Oder hier von Hand:</p>
    <div class="section"><div class="section-h">Name</div><div class="group"><div class="row"><input class="field wide" id="ob-name" placeholder="Vorname" value="${esc(pr.name||"")}" autocomplete="given-name"></div></div></div>

      <label class="row" for="ob-kg"><span class="lbl">Startgewicht</span><input class="field num" id="ob-kg" inputmode="decimal" placeholder="0,0" value="${pr.startWeight!=null?esc(fmt(pr.startWeight,2)):""}"><span class="unit">kg</span></label>

      <div class="section-f">Startgewicht am Starttag morgens nüchtern – lässt sich später unter Mehr ändern.</div></div>`,

    onSave: s => {

      if (!name){ toast("Bitte einen Namen eingeben"); return false; }

      const cm = parseNum($("#ob-cm", s).value), kg = parseNum($("#ob-kg", s).value), goal = parseNum($("#ob-goal", s).value);
      if (cm != null) o.cm = cm; if (kg != null) o.startWeight = kg; if (goal != null) o.goal = goal;
      writeDoc("profile","me", o); applyPerson(); renderAll(); toast("Hallo " + name);
    }});
}
async function offerFile(name, text, mime){
  const blob = new Blob([text], {type: mime});
  try {
    const file = new File([blob], name, {type: mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  } catch(e){ if (e && e.name === "AbortError") return false; }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch(e){}
  openSheet({title:"Export", left:"", right:"Fertig", body:`<p class="note" style="margin:8px 4px">Text kopieren und einfügen.</p>
    <div class="group"><div class="row"><textarea class="field wide" id="exp-t" rows="10" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(text.replace(/^﻿/,""))}</textarea></div></div>
    <div class="section"><button class="btn" id="exp-copy">Kopieren</button></div>`,
    onOpen: sh => { $("#exp-copy", sh).onclick = async () => { const t = $("#exp-t", sh); try { await navigator.clipboard.writeText(t.value); toast("Kopiert"); } catch(e){ t.focus(); t.select(); toast("Text markiert"); } }; }});
  return false;
}
async function doBackup(){
  const data = JSON.stringify({app:"formkurve", version:1, exportedAt:new Date().toISOString(), profile:S.profile, days:S.days, sessions:S.sessions, measures:S.measures, checkins:S.checkins});
  const ok = await offerFile(`Formkurve-Sicherung_${todayISO()}.json`, data, "application/json");
  if (ok){ lsSet("formkurve.backupAt", Date.now()); if (S.syncNote.startsWith("Letzte Sicherung")) S.syncNote = ""; renderAll(); toast("Sicherung erstellt"); }
}
function doRestore(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(r.result); } catch(e){ toast("Datei ist keine Sicherung"); return; }
    if (!o || o.app !== "formkurve"){ toast("Datei ist keine Formkurve-Sicherung"); return; }
    const n = Object.keys(o.days || {}).length;
    openSheet({title:"Sicherung laden", right:"Ersetzen", body:`<div class="card" style="margin-top:8px"><h3>${esc(o.profile?.name || "Unbekannt")}</h3>
      <p class="meta">${n} Tage · ${Object.keys(o.sessions||{}).length} Trainings · gesichert am ${esc(String(o.exportedAt||"").slice(0,10))}</p></div>
      <p class="note" style="margin:12px 4px">Alle Einträge auf diesem iPhone werden durch die Sicherung ersetzt.</p>`,
      onSave: () => { Object.assign(S, {profile:o.profile||null, days:o.days||{}, sessions:o.sessions||{}, measures:o.measures||{}, checkins:o.checkins||{}}); persistLocal(); applyPerson(); builtDate = null; builtTrain = null; renderAll(); toast("Sicherung geladen"); }});
  };
  r.readAsText(file);
}
async function doExport(kind){
  const p = P(), num = (v, d) => v==null ? "" : fmt(v, d).replace(/\./g, ""), rows = [];
  let name;
  if (kind === "tag"){
    name = `Tageslog_${p.person}.csv`;
    rows.push(["Datum","Gewicht","kcal","Protein","Schritte","Walking Pad","Kraft","Sport","Alkohol","Schlaf","Schlafqualität","Energie","Hunger","Stress","RR sys","RR dia", p.extra.label, "Notiz", "KFA %", "Tagestyp", "Wasser (l)", "Letzte Mahlzeit", "Kinder aktiv", "Ausrutscher", "Auslöser", "Widerstanden", "Sport (min)", "Intensität", "Runden", "Tag gewonnen", "Seiten", "Lernen (min)", "Zigaretten", "Handy (min)", "Top 3 erledigt"]);
    const end = todayISO();
    for (let d = p.startDate; d <= end; d = addDays(d,1)){
      const o = S.days[d] || {};
      rows.push([dateNum(d), num(o.w,2), num(o.kcal,0), num(o.p,0), num(o.steps,0), num(o.wp,0), o.kraft!=null?String(o.kraft):"", o.sport!=null?String(o.sport):"", o.alc!=null?String(o.alc):"",
        num(o.sleep,1), num(o.sq,0), num(o.en,0), num(o.hu,0), num(o.st,0), num(o.sys,0), num(o.dia,0), p.extra.type==="switch" ? (o[p.extra.k]!=null?String(o[p.extra.k]):"") : num(o[p.extra.k],0), o.note||"", num(o.kfa,1),
        o.typ ? Object.fromEntries(DAYTYPES[p.tmpl])[o.typ] : "", num(o.water,2), o.lastMeal||"", o.kids!=null?String(o.kids):"", o.slip!=null?String(o.slip):"",
        (o.trig||[]).map(t => Object.fromEntries(TRIGGERS)[t]).join(", "), num(o.crave,0), num(o.sportMin,0), num(o.rpe,0), num(o.rounds,0),
        ({won:"1", lost:"0"})[dayResult(d)] ?? "", num(o.read,0), num(o.learn,0), o.smoke != null ? String(o.smoke) : "", num(o.social,0),
        (o.top3||[]).filter(x => x.t).length ? (o.top3||[]).filter(x => x.t && x.d).length + "/" + (o.top3||[]).filter(x => x.t).length : ""]);
    }
  } else if (kind === "training"){
    name = `Trainingslog_${p.person}.csv`;
    rows.push(["Datum","Person","Übung","Gewicht (kg)","Wdh Satz 1","Wdh Satz 2","Wdh Satz 3","RIR letzter Satz","Schmerz 0–10","Notiz"]);
    Object.keys(S.sessions).sort().forEach(k => { const s = S.sessions[k];
      for (const [n, e] of Object.entries(s.ex||{})){ const r = e.r || []; if (e.w==null && !r.some(x=>x!=null)) continue;
        rows.push([dateNum(s.date), p.person, n, num(e.w,1), num(r[0],0), num(r[1],0), num(r[2],0), "", num(e.pain,0), r[3]!=null ? "Satz 4: " + r[3] : ""]); } });
  } else {
    name = `Masse_${p.person}.csv`;
    rows.push(["Datum"].concat(MFIELDS.map(m=>m[1])));
    Object.keys(S.measures).sort().forEach(k => { const m = S.measures[k]; rows.push([dateNum(k)].concat(MFIELDS.map(([f]) => num(m[f],1)))); });
  }
  if (rows.length < 2){ toast("Noch keine Daten"); return; }
  const csv = "﻿" + rows.map(r => r.map(c => /[;"\n]/.test(c) ? `"${String(c).replace(/"/g,'""')}"` : c).join(";")).join("\r\n");
  if (await offerFile(name, csv, "text/csv")) toast("Exportiert");
}

/* =================== Navigation =================== */
function setTab(t){
  S.tab = t; lsSet("trafo.tab", t);
  ["uebersicht","ausblick","heute","essen","training","leben","fortschritt","mehr"].forEach(x => { $("#s-"+x).hidden = x !== t; $("#t-"+x).setAttribute("aria-selected", String(x===t)); });
  renderAll(true); window.scrollTo(0,0);
}
function renderAll(){
  const t = S.tab;
  if (t === "uebersicht" && !document.querySelector("#s-uebersicht :focus")) renderUebersicht();
  if (t === "ausblick") renderAusblick();
  if (t === "heute") renderHeute(false);
  if (t === "essen" && !document.querySelector("#s-essen input:focus")) renderEssen();
  if (t === "training") renderTraining(false);
  if (t === "leben" && !document.querySelector("#s-leben input:focus")) renderLeben();
  if (t === "fortschritt" && !document.querySelector("#s-fortschritt :focus")) renderFortschritt();
  if (t === "mehr") renderMehr();
}
$$(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
const savedTab = lsGet("trafo.tab"); if (["uebersicht","ausblick","heute","essen","training","leben","fortschritt","mehr"].includes(savedTab)) S.tab = savedTab;
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.date > todayISO()) S.date = todayISO(); });

applyPerson();
setTab(S.tab);
initStore();
})();
